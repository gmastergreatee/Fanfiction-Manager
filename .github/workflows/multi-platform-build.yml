name: Multi-Platform Build & Release Matrix

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Run Cross-Platform Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22 with Cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Project & Frontend Dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Verify Frontend Build
        run: npm run build --prefix frontend

      - name: Run Full Version 4 Test Suite
        run: npm test

  build-desktop-and-mobile:
    name: Build (${{ matrix.platform.name }})
    needs: test-and-verify
    runs-on: ${{ matrix.platform.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS (Universal / arm64)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Linux (AppImage & deb)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Tune Windows Defender for Build Performance
        if: matrix.platform.os == 'windows-latest'
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionProcess "rustc.exe", "cargo.exe", "link.exe", "node.exe"
        continue-on-error: true

      - name: Setup Node.js 22 with Cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Linux System Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Project & Frontend Dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build Frontend Assets
        run: npm run build --prefix frontend

      - name: Build Tauri 2.0 Native Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Fanfiction Manager Version 4 - {0}', github.ref_name) || '' }}
          releaseBody: 'Automated release for Fanfiction Manager Version 4 across Windows, macOS, Linux, and Mobile.'
          releaseDraft: false
          prerelease: false

  build-android:
    name: Build Android APK
    needs: test-and-verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22 with Cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Project & Frontend Dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build Frontend Bundle
        run: npm run build --prefix frontend

      - name: Build Android Release Bundle
        run: npm run package:release

      - name: Upload Android Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/app.zip
            dist/mobile-bundle.zip
            dist/checksums.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
