[package]
name = "fanfiction-manager"
version = "4.0.0"
description = "Next-Gen Multi-Platform Fanfiction Manager & Downloader"
authors = ["gmastergreatee"]
edition = "2021"

[lib]
name = "fanfiction_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "json"] }
scraper = "0.20"
regex = "1.10"

